services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: threadlight
      POSTGRES_PASSWORD: threadlight
      POSTGRES_DB: threadlight
    # 5433 on the host so it doesn't collide with a locally installed Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadlight -d threadlight"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
