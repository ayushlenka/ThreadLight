[project]
name = "threadlight"
version = "0.1.0"
description = "Permission-aware knowledge engine for Discord: ask what your team decided, get cited answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "discord.py>=2.5",
    "voyageai>=0.3",
    "anthropic>=1.11",
]

[project.scripts]
threadlight = "threadlight.__main__:main"

[project.optional-dependencies]
# Development only: tests, linting, and the eval tooling (corpus loader needs YAML).
# The production image installs none of these.
dev = [
    "pyyaml>=6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threadlight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic.
"alembic/versions/*" = ["E501"]
