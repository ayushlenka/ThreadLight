# Synthetic Discord history for extraction and retrieval evals.
#
# A five-person student team building "Campus Eats", a campus food-ordering app, over a
# semester. Hand-written with ground truth recorded inline under each conversation:
#
#   decisions:   what a correct extractor should find in that conversation
#     key        stable id, referenced by `supersedes`
#     status     decided | proposed
#     message    1-based index of the message where it was settled
#     optional   true for borderline decisions (implementation details, minor follow-ons):
#                finding one isn't a false positive, missing one isn't a false negative
#   ambiguous:   true marks a conversation reasonable people could label either way; it is
#                excluded from precision/recall.
#
# Conversations in the same channel are hours or days apart and messages inside one are
# minutes apart, so the 45-minute segmenter recovers these exact boundaries (the loader
# checks this). Messages are [minutes_after_start, author, text].

guild:
  name: Campus Eats (synthetic)
  owner: maya

members: [maya, dev, priya, sam, jordan, alex]

roles:
  - name: leads
    members: [maya, dev]

channels:
  - name: general
  - name: backend
  - name: frontend
  - name: leads
    private_to: [leads]

conversations:
  - key: db-choice
    channel: backend
    start: 2025-01-08 19:00
    messages:
      - [0, priya, "ok so for the database, are we doing postgres or mongo? i've used mongo more"]
      - [2, maya, "i'd lean postgres. our data is super relational: users, restaurants, orders, menu items"]
      - [4, priya, "fair. mongo would make the menu stuff easier though, menus are kind of nested"]
      - [6, maya, "postgres has jsonb for that. and we get real transactions for orders, which matters when payment and order creation have to succeed together"]
      - [9, dev, "+1 postgres, the neon free tier is nice too"]
      - [11, maya, "cool, decision: postgres. priya can you set up the schema this week?"]
      - [12, priya, "yep on it"]
    decisions:
      - key: db-postgres
        title: Use PostgreSQL as the database
        status: decided
        message: 6

