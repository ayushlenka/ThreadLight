      - [7, dev, "jwt is fine for mvp imo, we can add google later"]
      - [9, maya, "ok let's go JWT-only for now and revisit after the beta"]
      - [10, priya, "access token 15 min, refresh token 7 days?"]
      - [11, maya, "sounds good"]
    decisions:
