      - [5, jordan, "everyone asked 'can i just sign in with google'"]

  - key: auth-oauth
    channel: backend
    start: 2025-02-13 19:30
    messages:
      - [0, maya, "after the user testing stuff in #general i think we should switch to google sign in"]
      - [2, priya, "agree. the reset emails landing in spam is a real problem and i don't want to babysit email deliverability"]
      - [4, dev, "also storing passwords at all is a security risk we don't need. google handles 2fa etc"]
      - [5, priya, "every student here has a google account through the school anyway"]
      - [7, maya, "ok decided: we're moving auth to google oauth and dropping email/password. priya owns it, target end of feb"]
      - [8, priya, "on it. i'll keep the jwt session tokens, just issue them after google verifies"]
    decisions:
