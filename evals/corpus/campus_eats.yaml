      - [2, sam, "i know react already, never touched dart"]
      - [4, jordan, "from the design side either is fine, but expo makes sharing previews with me way easier"]
      - [6, dev, "yeah expo is a big plus. and we can share types with the backend if it's all typescript"]
      - [7, sam, "react native + expo then?"]
      - [8, dev, "yep, going with react native + expo"]
